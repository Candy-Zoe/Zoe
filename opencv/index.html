<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1a2e'/><text x='16' y='22' text-anchor='middle' fill='%2300d4ff' font-family='Arial' font-weight='bold' font-size='14'>CV</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCV 调试平台</title>
  <style>
    :root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-tertiary: #252542; --text-primary: #fff; --text-secondary: #a0a0b0; --accent: #00d4ff; --border: #2d2d4a; --success: #00ff88; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'SF Mono', 'Consolas', monospace; background: var(--bg-primary); color: var(--text-primary); }
    #app { display: flex; height: 100vh; }
    .nav { width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .nav-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .nav-logo { display: flex; align-items: center; gap: 12px; }
    .nav-logo h1 { font-size: 16px; background: linear-gradient(135deg, var(--accent), var(--success)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-menu { flex: 1; overflow-y: auto; padding: 12px 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; cursor: pointer; color: var(--text-secondary); border-left: 3px solid transparent; transition: all 0.2s; font-size: 13px; }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: var(--bg-tertiary); color: var(--accent); border-left-color: var(--accent); }
    .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; flex-shrink: 0; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { display: flex; gap: 12px; padding: 12px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); align-items: center; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .page-title { font-size: 20px; margin-bottom: 4px; font-weight: 600; }
    .page-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
    .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .upload-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 12px; }
    .upload-zone:hover { border-color: var(--accent); background: rgba(0, 212, 255, 0.05); }
    .upload-zone svg { width: 32px; height: 32px; stroke: var(--text-secondary); margin-bottom: 8px; }
    .upload-zone p { color: var(--text-secondary); font-size: 13px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--bg-primary); }
    .btn-primary:hover { background: #00b8e6; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .slider-group { margin-bottom: 12px; }
    .slider-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .slider-label { font-size: 12px; color: var(--text-secondary); }
    .slider-value { font-size: 12px; color: var(--accent); font-weight: 600; }
    input[type="range"] { width: 100%; height: 4px; background: var(--bg-tertiary); border-radius: 2px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { width: 14px; height: 14px; background: var(--accent); border-radius: 50%; -webkit-appearance: none; cursor: pointer; }
    input[type="color"] { width: 36px; height: 36px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }
    input[type="text"], input[type="number"] { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text-primary); font-size: 13px; }
    select { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text-primary); font-size: 13px; cursor: pointer; }
    .compare-view { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .compare-item { display: flex; flex-direction: column; }
    .compare-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
    .canvas-wrapper { background: var(--bg-tertiary); border-radius: 8px; overflow: hidden; padding: 12px; display: flex; justify-content: center; min-height: 150px; align-items: center; }
    .canvas-wrapper canvas, .canvas-wrapper img { max-width: 100%; max-height: 300px; }
    .canvas-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .loading-overlay { position: fixed; inset: 0; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-secondary); font-size: 14px; }
    .loading-progress-bar { width: 200px; height: 3px; background: var(--bg-tertiary); border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .loading-progress-fill { height: 100%; background: var(--accent); transition: width 0.1s; }
    .hidden-input { display: none; }
    .info-box { background: var(--bg-tertiary); border-radius: 8px; padding: 10px; margin-top: 10px; }
    .info-box p { color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
    .image-preview { position: relative; display: inline-block; }
    .image-preview img { max-width: 100%; border-radius: 6px; }
    .image-info { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
    .tab.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
    .param-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .param-label { font-size: 12px; color: var(--text-secondary); min-width: 80px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // ========== 工具函数 ==========
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const createSlider = (label, min, max, value, step = 1, onChange) => {
      const group = document.createElement('div');
      group.className = 'slider-group';
      group.innerHTML = `<div class="slider-header"><span class="slider-label">${label}</span><span class="slider-value">${value}</span></div><input type="range" min="${min}" max="${max}" value="${value}" step="${step}">`;
      const input = group.querySelector('input'), display = group.querySelector('.slider-value');
      input.addEventListener('input', () => { display.textContent = input.value; onChange(parseFloat(input.value)); });
      return group;
    };

    const createButtonGroup = (buttons) => {
      const group = document.createElement('div');
      group.className = 'btn-group';
      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.className = `btn btn-secondary${btn.active ? ' active' : ''}`;
        b.textContent = btn.label;
        b.addEventListener('click', () => { $$('.btn-group button').forEach(x => x.classList.remove('active')); b.classList.add('active'); btn.onClick(); });
        group.appendChild(b);
      });
      return group;
    };

    const uploadImage = (containerId, onLoaded) => {
      const container = $(`#${containerId}`);
      if (!container) return;
      container.innerHTML = `<div class="upload-zone" id="${containerId}Zone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><p>点击或拖拽上传图片</p><input type="file" id="${containerId}Input" class="hidden-input" accept="image/*"></div>`;
      const zone = $(`#${containerId}Zone`), input = $(`#${containerId}Input`);
      zone.addEventListener('click', () => input.click());
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.borderColor = 'var(--accent)'; });
      zone.addEventListener('dragleave', () => zone.style.borderColor = '');
      zone.addEventListener('drop', (e) => { e.preventDefault(); zone.style.borderColor = ''; loadFile(e.dataTransfer.files[0]); });
      input.addEventListener('change', () => { if (input.files[0]) loadFile(input.files[0]); });
      const loadFile = (file) => {
        if (!file?.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            zone.innerHTML = `<div class="image-preview"><img src="${canvas.toDataURL()}"><div class="image-info">${img.width} x ${img.height}</div></div>`;
            onLoaded(canvas, img);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };
    };

    const showResult = (containerId, canvas) => {
      const container = $(`#${containerId}`);
      if (container) { container.innerHTML = ''; canvas.style.maxWidth = '100%'; container.appendChild(canvas); }
      window.currentResult = canvas;
    };

    const downloadResult = () => { if (window.currentResult) { const a = document.createElement('a'); a.download = 'result.png'; a.href = window.currentResult.toDataURL(); a.click(); } };

    // ========== 全局状态 ==========
    let srcCanvas = null, srcImage = null;

    // ========== 导航配置 ==========
    const navItems = [
      { id: 'home', label: '首页', icon: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>' },
      { id: 'grayscale', label: '灰度处理', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/>' },
      { id: 'brightness', label: '亮度对比度', icon: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>' },
      { id: 'blur', label: '模糊滤镜', icon: '<circle cx="12" cy="12" r="10" stroke-dasharray="2 2"/>' },
      { id: 'edge', label: '边缘检测', icon: '<polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>' },
      { id: 'morphology', label: '形态学', icon: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>' },
      { id: 'colorspace', label: '颜色空间', icon: '<circle cx="12" cy="12" r="10"/>' },
      { id: 'threshold', label: '阈值处理', icon: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="12" y1="3" x2="12" y2="21"/>' },
      { id: 'transform', label: '几何变换', icon: '<polyline points="23,4 23,10 17,10"/><polyline points="1,20 1,14 7,14"/>' },
      { id: 'contour', label: '轮廓检测', icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' },
      { id: 'histogram', label: '直方图', icon: '<rect x="3" y="14" width="4" height="6"/><rect x="10" y="10" width="4" height="10"/><rect x="17" y="6" width="4" height="14"/>' },
      { id: 'houghlines', label: '霍夫变换', icon: '<line x1="4" y1="20" x2="20" y2="4"/><circle cx="12" cy="12" r="3"/>' },
      { id: 'template', label: '模板匹配', icon: '<rect x="2" y="2" width="8" height="8"/><rect x="14" y="14" width="8" height="8"/>' },
      { id: 'harris', label: '角点检测', icon: '<polygon points="12,2 22,22 2,22"/>' },
      { id: 'blend', label: '图像融合', icon: '<circle cx="9" cy="9" r="6"/><circle cx="15" cy="15" r="6"/>' },
      { id: 'denoise', label: '去噪处理', icon: '<path d="M3 12a9 9 0 1 0 9-9"/><path d="M12 8v4l2 2"/>' },
      { id: 'gradient', label: '梯度运算', icon: '<path d="M12 2L12 22"/><path d="M2 12L22 12"/>' },
      { id: 'skin', label: '肤色检测', icon: '<circle cx="12" cy="8" r="5"/><path d="M12 13v8"/>' },
      { id: 'perspective', label: '透视变换', icon: '<path d="M2 22 L22 22 L22 2 L2 2 Z"/><path d="M6 18 L18 6"/>' },
      { id: 'morph2', label: '顶帽底帽', icon: '<rect x="3" y="8" width="18" height="8"/><rect x="8" y="3" width="8" height="18"/>' },
      { id: 'filter', label: '图像滤镜', icon: '<polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>' },
      { id: 'watercolor', label: '水彩效果', icon: '<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.78-.09 2.63-.25"/>' },
      { id: 'cartoon', label: '漫画效果', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>' },
      { id: 'emboss', label: '浮雕效果', icon: '<polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/>' },
      { id: 'vintage', label: '复古滤镜', icon: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>' },
      { id: 'inpaint', label: '图像修复', icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' },
      { id: 'segmentation', label: '前景分割', icon: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/>' },
      { id: 'chromakey', label: '抠图换背景', icon: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>' },
      { id: 'text', label: '添加文字', icon: '<polyline points="4,7 4,4 20,4 20,7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>' },
      { id: 'resize', label: '调整尺寸', icon: '<polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>' },
      { id: 'crop', label: '裁剪工具', icon: '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>' },
      { id: 'rotate', label: '旋转翻转', icon: '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>' },
      { id: 'sharpen', label: '锐化处理', icon: '<polygon points="12,2 19,21 5,21"/>' },
      { id: 'noise', label: '噪声添加', icon: '<circle cx="12" cy="12" r="3"/>' },
      { id: 'clahe', label: '自适应均衡', icon: '<rect x="3" y="14" width="4" height="6"/><rect x="10" y="10" width="4" height="10"/><rect x="17" y="6" width="4" height="14"/>' }
    ];

    // ========== 页面实现 ==========
    const pages = {
      home: {
        render: () => {
          $$('.content')[0].innerHTML = `
            <h2 class="page-title">OpenCV 在线调试平台</h2>
            <p class="page-desc">纯前端实现的 OpenCV.js 图像处理工具，支持 35+ 种图像处理功能</p>
            <div class="grid-3">
              <div class="card"><div class="card-title">快速开始</div><p style="color: var(--text-secondary); font-size: 12px; line-height: 1.6;">从左侧导航选择功能模块，上传图片后即可实时预览处理效果</p></div>
              <div class="card"><div class="card-title">处理类型</div><ul style="color: var(--text-secondary); font-size: 12px; padding-left: 16px; line-height: 1.8;"><li>图像增强与滤镜</li><li>边缘与轮廓检测</li><li>几何变换</li><li>颜色空间处理</li></ul></div>
              <div class="card"><div class="card-title">技术特点</div><ul style="color: var(--text-secondary); font-size: 12px; padding-left: 16px; line-height: 1.8;"><li>纯前端处理保护隐私</li><li>图片不上传服务器</li><li>实时预览</li><li>支持下载结果</li></ul></div>
            </div>
            <div class="card"><div class="card-title">上传图片</div><div id="homeUpload"></div><div id="homePreview" class="canvas-wrapper" style="display:none;"><div class="compare-label">原图</div></div><div class="btn-group"><button class="btn btn-primary" id="processBtn">去灰度处理</button></div></div>
          `;
          uploadImage('homeUpload', (canvas, img) => {
            srcCanvas = canvas; srcImage = img;
            const preview = $('#homePreview');
            preview.style.display = 'block';
            const origC = document.createElement('canvas'); origC.width = img.width; origC.height = img.height; origC.getContext('2d').drawImage(img, 0, 0);
            preview.innerHTML = '<div class="compare-label">原图</div>'; preview.appendChild(origC);
          });
          $('#processBtn').addEventListener('click', () => switchPage('grayscale'));
        }
      },
      grayscale: {
        render: () => {
          $$('.content')[0].innerHTML = `
            <h2 class="page-title">灰度处理</h2><p class="page-desc">彩色图转灰度图</p>
            <div class="card"><div class="card-title">上传图片</div><div id="upload"></div></div>
            <div class="card"><div class="card-title">参数</div><div id="sliders"></div><div class="btn-group"><button class="btn btn-primary" id="apply">应用</button><button class="btn btn-secondary" id="download">下载</button></div></div>
            <div class="card"><div class="card-title">结果</div><div class="compare-view"><div class="compare-item"><div class="compare-label">原图</div><div id="orig" class="canvas-wrapper"></div></div><div class="compare-item"><div class="compare-label">灰度图</div><div id="result" class="canvas-wrapper"></div></div></div>
          `;
          uploadImage('upload', (canvas, img) => {
            srcCanvas = canvas; srcImage = img;
            const origC = document.createElement('canvas'); origC.width = img.width; origC.height = img.height; origC.getContext('2d').drawImage(img, 0, 0);
            $('#orig').innerHTML = ''; $('#orig').appendChild(origC);
          });
          $$('#sliders')[0].appendChild(createSlider('对比度', 0.5, 2, 1, 0.1, v => window.p_contrast = v));
          $('#apply').addEventListener('click', () => {
            if (!srcCanvas) { alert('请先上传图片'); return; }
            const src = cv.imread(srcCanvas), gray = new cv.Mat(), dst = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            gray.convertTo(dst, -1, window.p_contrast || 1, 0);
            const origC = document.createElement('canvas'); origC.width = src.cols; origC.height = src.rows; cv.imshow(origC, src);
            $('#orig').innerHTML = ''; $('#orig').appendChild(origC);
            const resultC = document.createElement('canvas'); resultC.width = dst.cols; resultC.height = dst.rows; cv.imshow(resultC, dst);
            showResult('result', resultC);
            src.delete(); gray.delete(); dst.delete();
          });
          $('#download').addEventListener('click', downloadResult);
        }
      },
      brightness: {
        render: () => {
          $$('.content')[0].innerHTML = `
            <h2 class="page-title">亮度与对比度</h2><p class="page-desc">调整图像的亮度和对比度</p>
            <div class="card"><div class="card-title">上传图片</div><div id="upload"></div></div>
            <div class="card"><div class="card-title">参数调整</div><div id="sliders"></div><div class="btn-group"><button class="btn btn-primary" id="apply">应用</button><button class="btn btn-secondary" id="download">下载</button></div></div>
            <div class="card"><div class="card-title">结果</div><div class="compare-view"><div class="compare-item"><div class="compare-label">原图</div><div id="orig" class="canvas-wrapper"></div></div><div class="compare-item"><div class="compare-label">效果图</div><div id="result" class="canvas-wrapper"></div></div></div>
          `;
          uploadImage('upload', (canvas, img) => {
            srcCanvas = canvas; srcImage = img;
            const origC = document.createElement('canvas'); origC.width = img.width; origC.height = img.height; origC.getContext('2d').drawImage(img, 0, 0);
            $('#orig').innerHTML = ''; $('#orig').appendChild(origC);
          });
          $$('#sliders')[0].appendChild(createSlider('亮度', -100, 100, 0, 1, v => window.p_brightness = v));
          $$('#sliders')[0].appendChild(createSlider('对比度', 0.1, 3, 1, 0.1, v => window.p_contrast = v));
          $('#apply').addEventListener('click', () => {
            if (!srcCanvas) { alert('请先上传图片'); return; }
            const src = cv.imread(srcCanvas), dst = new cv.Mat();
            src.convertTo(dst, -1, window.p_contrast || 1, window.p_brightness || 0);
            const origC = document.createElement('canvas'); origC.width = src.cols; origC.height = src.rows; cv.imshow(origC, src);
            $('#orig').innerHTML = ''; $('#orig').appendChild(origC);
            const resultC = document.createElement('canvas'); resultC.width = dst.cols; resultC.height = dst.rows; cv.imshow(resultC, dst);
            showResult('result', resultC);
            src.delete(); dst.delete();

            const resultC = document.createElement('canvas'); resultC.width = dst.cols; resultC.height = dst.rows; cv.imshow(resultC, dst);
            showResult('result', resultC);
            src.delete(); dst.delete();
          });
          $('#download').addEventListener('click', downloadResult);
        }
      },
      clahe: {
        render: () => {
          $$('.content')[0].innerHTML = `
            <h2 class="page-title">自适应直方图均衡</h2><p class="page-desc">CLAHE对比度受限自适应直方图均衡化</p>
            <div class="card"><div class="card-title">上传图片</div><div id="upload"></div></div>
            <div class="card"><div class="card-title">参数</div><div id="sliders"></div><div class="btn-group"><button class="btn btn-primary" id="apply">应用</button><button class="btn btn-secondary" id="download">下载</button></div></div>
            <div class="card"><div class="card-title">结果</div><div class="compare-view"><div class="compare-item"><div class="compare-label">原图</div><div id="orig" class="canvas-wrapper"></div></div><div class="compare-item"><div class="compare-label">均衡后</div><div id="result" class="canvas-wrapper"></div></div></div>
          `;
          uploadImage('upload', (canvas, img) => {
            srcCanvas = canvas; srcImage = img;
            const origC = document.createElement('canvas'); origC.width = img.width; origC.height = img.height; origC.getContext('2d').drawImage(img, 0, 0);
            $('#orig').innerHTML = ''; $('#orig').appendChild(origC);
          });
          let clipLimit = 2.0, tileSize = 8;
          $$('#sliders')[0].appendChild(createSlider('对比度限制', 1, 10, clipLimit, 0.5, v => clipLimit = v));
          $$('#sliders')[0].appendChild(createSlider('网格大小', 4, 16, tileSize, 1, v => tileSize = v));
          $('#apply').addEventListener('click', () => {
            if (!srcCanvas) { alert('请先上传图片'); return; }
            const src = cv.imread(srcCanvas), gray = new cv.Mat(), dst = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            const clahe = cv.createCLAHE(clipLimit, new cv.Size(tileSize, tileSize));
            clahe.apply(gray, dst);
            cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);
            const resultC = document.createElement('canvas'); resultC.width = dst.cols; resultC.height = dst.rows; cv.imshow(resultC, dst);
            showResult('result', resultC);
            src.delete(); gray.delete(); dst.delete();
          });
          $('#download').addEventListener('click', downloadResult);
        }
      }
    };

    // ========== 导航初始化 ==========
    const initNav = () => {
      const menu = $('#navMenu');
      menu.innerHTML = navItems.map(item => `<div class="nav-item${item.id === 'home' ? ' active' : ''}" data-page="${item.id}"><svg viewBox="0 0 24 24" stroke-width="2">${item.icon}</svg><span>${item.label}</span></div>`).join('');
      menu.addEventListener('click', (e) => {
        const target = e.target.closest('.nav-item');
        if (target) {
          const page = target.dataset.page;
          $$('.nav-item').forEach(i => i.classList.remove('active'));
          target.classList.add('active');
          switchPage(page);
        }
      });
    };

    const switchPage = (pageName) => {
      if (pages[pageName]) pages[pageName].render();
    };

    // ========== OpenCV 加载 ==========
    const loadOpenCV = (onProgress) => {
      return new Promise((resolve, reject) => {
        if (window.cv) { resolve(); return; }
        const script = document.createElement('script');
        script.src = 'opencv/opencv.js';
        script.async = true;
        if (onProgress) { onProgress(0); let loaded = 0; const interval = setInterval(() => { loaded += 2; if (loaded < 90) onProgress(loaded); }, 100); script.onload = () => { clearInterval(interval); onProgress(95); const check = setInterval(() => { if (window.cv) { clearInterval(check); onProgress(100); resolve(); } }, 50); }; script.onerror = () => { clearInterval(interval); script.src = 'https://docs.opencv.org/4.9.0/opencv.js'; document.head.appendChild(script); }; }
        document.head.appendChild(script);
      });
    };

    const init = async () => {
      const app = $('#app');
      app.innerHTML = `<div class="loading-overlay"><div class="loading-spinner"></div><div class="loading-text">加载 OpenCV.js...</div><div class="loading-progress-bar"><div class="loading-progress-fill" id="progress"></div></div></div>`;
      try {
        await loadOpenCV((p) => { $('#progress').style.width = `${p}%`; });
        app.innerHTML = `<nav class="nav"><div class="nav-header"><div class="nav-logo"><svg viewBox="0 0 36 36"><rect width="36" height="36" rx="8" fill="#252542"/><text x="18" y="25" text-anchor="middle" fill="url(#g)" font-family="Arial" font-weight="bold" font-size="14">CV</text><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#00ff88"/></linearGradient></defs></svg><h1>OpenCV 调试</h1></div></div><div class="nav-menu" id="navMenu"></div></nav><main class="main"><div class="content"></div></main>`;
        initNav();
        switchPage('home');
      } catch (err) {
        app.innerHTML = `<div class="loading-overlay"><div class="loading-text" style="color: #ff4466;">加载失败</div><button class="btn btn-primary" onclick="location.reload()">重试</button></div>`;
      }
    };

    init();
  </script>
</body>
</html>
