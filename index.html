<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .nav-grid {
            display: grid;
            gap: 20px;
        }

        .nav-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .nav-card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .nav-icon.pdf {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .nav-icon.opencv {
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
        }

        .nav-info {
            text-align: left;
        }

        .nav-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .nav-desc {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .nav-arrow {
            margin-left: auto;
            color: #95a5a6;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .nav-card:hover .nav-arrow {
            transform: translateX(5px);
        }

        footer {
            margin-top: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .nav-card {
                padding: 20px;
            }

            .nav-icon {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 项目导航</h1>
        <p class="subtitle">选择一个项目开始探索</p>
        
        <div class="nav-grid">
            <div class="nav-card">
                <a href="pdf/demo/viewer.html" target="_blank">
                    <div class="nav-icon pdf">📄</div>
                    <div class="nav-info">
                        <div class="nav-title">PDF 项目</div>
                        <div class="nav-desc">PDF 相关功能演示与示例</div>
                    </div>
                    <span class="nav-arrow">→</span>
                </a>
            </div>

            <div class="nav-card">
                <a href="opencv/index.html" target="_blank">
                    <div class="nav-icon opencv">🔍</div>
                    <div class="nav-info">
                        <div class="nav-title">OpenCV 项目</div>
                        <div class="nav-desc">计算机视觉与图像处理演示</div>
                    </div>
                    <span class="nav-arrow">→</span>
                </a>
            </div>
        </div>

        <footer>
            © 2026 Project Navigation
        </footer>
    </div>
</body>
</html>
